repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend/app)
        # Run from the repo root (pre-commit's default cwd): mypy doesn't
        # search upward for pyproject.toml like ruff does, so `cd backend`
        # first would silently fall back to unconfigured defaults.
        entry: mypy backend/app
        language: system
        pass_filenames: false
        files: ^backend/app/.*\.py$

      - id: frontend-eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npm run -s lint'
        language: system
        pass_filenames: false
        files: ^frontend/src/.*\.(ts|tsx)$

      - id: frontend-prettier
        name: prettier --check (frontend)
        entry: bash -c 'cd frontend && npx -s prettier --check .'
        language: system
        pass_filenames: false
        files: ^frontend/(src|.*\.(json|ya?ml|md))/.*$
