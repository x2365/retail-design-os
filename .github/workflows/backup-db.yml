name: Backup database

# Render's free Postgres plan has no automatic backups and the DB is dropped
# after a period of inactivity/expiry — this is the only safety net.
# Dumps go into the same R2 bucket already used for file uploads
# (backend/app/storage.py), under a separate db-backups/ prefix.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database
        run: |
          set -euo pipefail
          docker run --rm postgres:16-alpine \
            pg_dump --no-owner --no-privileges --format=plain "$DATABASE_URL" \
            | gzip > backup.sql.gz
          # Sanity check: fail loudly on an empty/near-empty dump instead of
          # silently uploading a useless backup (e.g. bad/expired DATABASE_URL).
          size=$(stat -c%s backup.sql.gz 2>/dev/null || stat -f%z backup.sql.gz)
          if [ "$size" -lt 1024 ]; then
            echo "::error::Dump is suspiciously small ($size bytes) — aborting." >&2
            exit 1
          fi
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}

      - name: Upload to R2
        run: |
          set -euo pipefail
          name="db-backups/$(date -u +%F)-backup.sql.gz"
          docker run --rm -v "$PWD:/data" \
            -e AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
            -e AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
            -e AWS_DEFAULT_REGION=auto \
            amazon/aws-cli s3 cp /data/backup.sql.gz "s3://$R2_BUCKET_NAME/$name" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
