name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (typecheck)
        # Run from the repo root: mypy doesn't search upward for pyproject.toml
        # like ruff does, so running it from backend/ would silently fall back
        # to unconfigured defaults instead of using our settings.
        working-directory: .
        run: mypy backend/app

      - name: Pytest
        run: pytest -q
