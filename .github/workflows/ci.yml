name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Mypy (typecheck)
        # Run from the repo root: mypy doesn't search upward for pyproject.toml
        # like ruff does, so running it from backend/ would silently fall back
        # to unconfigured defaults instead of using our settings.
        working-directory: .
        run: mypy backend/app

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier (format check)
        run: npx prettier --check .

      - name: ESLint (lint)
        run: npm run lint

      - name: i18n (every UI string has an English translation)
        run: npm run i18n:check

      - name: Build (includes tsc typecheck)
        run: npm run build

  deploy:
    # Render isn't connected to GitHub with its app (no webhooks), so its own
    # auto-deploy never fires. Instead CI calls each service's Deploy Hook once
    # both check jobs are green, pinned to the exact commit that was tested.
    # Hooks live in repo secrets (Render → service → Settings → Deploy Hook).
    name: Deploy to Render
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hooks
        env:
          API_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          FRONTEND_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          set -euo pipefail
          if [ -z "$API_HOOK" ] || [ -z "$FRONTEND_HOOK" ]; then
            echo "::warning::Render deploy hooks are not configured — skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "${API_HOOK}&ref=${GITHUB_SHA}" -o /dev/null
          curl -fsS -X POST "${FRONTEND_HOOK}&ref=${GITHUB_SHA}" -o /dev/null
          echo "Deploy of ${GITHUB_SHA::7} requested for retaildesign-api and retaildesign-frontend."
