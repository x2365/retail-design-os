[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/app", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # FastAPI's Depends(...) as a default argument is the intended pattern
]

[tool.ruff.lint.per-file-ignores]
"backend/migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
files = ["backend/app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "app.migrations.*"
ignore_errors = true
