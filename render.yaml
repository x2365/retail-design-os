databases:
  - name: retaildesign-db
    plan: free
    databaseName: retaildesign
    user: retaildesign

services:
  - type: web
    name: retaildesign-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: retaildesign-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: WEB_CONCURRENCY
        value: "2"

  - type: web
    name: retaildesign-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://retaildesign-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
