databases:
  - name: retaildesign-db
    plan: free
    databaseName: retaildesign
    user: retaildesign

services:
  - type: web
    name: retaildesign-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: retaildesign-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: SEED_ON_STARTUP
        value: "true"
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: WEB_CONCURRENCY
        value: "2"
      # Render's free tier has no persistent disk — UPLOAD_DIR above is wiped
      # on every restart/redeploy. Set these four (Cloudflare R2, S3-compatible,
      # free up to 10GB) in the Render dashboard to store uploads durably
      # instead; sync: false keeps the actual secret values out of git.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      # POST /api/internal/1c/payment-status — receiving side of a future 1С
      # push (no real 1С connected). generateValue so the endpoint works
      # out of the box for demoing; the value is visible in the Render
      # dashboard for whoever needs to call it.
      - key: ONEC_SERVICE_TOKEN
        generateValue: true
      # Error monitoring (Sentry, free tier). Create a project at sentry.io
      # and set the DSN in the Render dashboard; sync: false keeps it out of
      # git. Leave unset to keep monitoring disabled.
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: retaildesign-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://retaildesign-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
